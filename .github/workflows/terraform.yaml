
name: 01 - Production Workflow Trigger Demo

on:
  push:
    branches:
      - "feature/*"
      - "main"    

    paths:
      - "Environment/dev/*"
      - "module/"

   pull:
    types:
        - opened
        - synchronize
        - reopened
        - ready_for_review

    branches: 
        - "main"    




jobs:
  validation-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print Workflow Context
        run: |
          echo "Workflow triggered successfully"
          echo "Event Type: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"

     
